[project]
name = "clickup-mcp"
version = "1.0.0"
description = "Native MCP server for ClickUp"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=3.1.0",
  "requests>=2.32.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4.0"
]

[project.scripts]
clickup-mcp = "server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["clickup_mcp_data"]
py-modules = ["server", "mcp_oauth"]

[tool.setuptools.package-data]
clickup_mcp_data = ["*.json"]
